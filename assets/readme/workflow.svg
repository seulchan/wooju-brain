<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">From capture to durable context</title>
  <desc id="workflow-desc">A four-step sequence for wooju-brain: capture material in inbox, inspect it with the repository rules, route it to the right canonical layer, and preserve provenance, time, uncertainty, and links.</desc>

  <rect width="1200" height="380" rx="26" fill="#101312"/>
  <text x="56" y="58"
        fill="#E5A15F"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" letter-spacing="1.3">THE OPERATING LOOP / START WITH A FILE</text>
  <text x="56" y="105"
        fill="#F3F0E8"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">Capture first. Curate what should survive.</text>

  <path d="M126 208H1074" stroke="#3A4640" stroke-width="2"/>
  <path d="M342 203L350 208L342 213" fill="none" stroke="#E5A15F" stroke-width="2"/>
  <path d="M610 203L618 208L610 213" fill="none" stroke="#E5A15F" stroke-width="2"/>
  <path d="M878 203L886 208L878 213" fill="none" stroke="#E5A15F" stroke-width="2"/>

  <g id="capture-step">
    <circle cx="126" cy="208" r="29" fill="#E5A15F"/>
    <text x="126" y="216" text-anchor="middle"
          fill="#101312"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="700">01</text>
    <text x="56" y="270"
          fill="#E5A15F"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="1">CAPTURE</text>
    <text x="56" y="304"
          fill="#F3F0E8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="24">inbox/</text>
    <text x="56" y="334"
          fill="#AEB8AF"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">files · notes · pages</text>
  </g>

  <g id="inspect-step">
    <circle cx="394" cy="208" r="29" fill="#9BC4A4"/>
    <text x="394" y="216" text-anchor="middle"
          fill="#101312"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="700">02</text>
    <text x="324" y="270"
          fill="#9BC4A4"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="1">INSPECT</text>
    <text x="324" y="304"
          fill="#F3F0E8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21">AGENTS.md</text>
    <text x="324" y="334"
          fill="#AEB8AF"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">then docs/INGEST.md</text>
  </g>

  <g id="route-step">
    <circle cx="662" cy="208" r="29" fill="#8CB5D1"/>
    <text x="662" y="216" text-anchor="middle"
          fill="#101312"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="700">03</text>
    <text x="592" y="270"
          fill="#8CB5D1"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="1">ROUTE</text>
    <text x="592" y="304"
          fill="#F3F0E8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19">right layer</text>
    <text x="592" y="334"
          fill="#AEB8AF"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">source · wiki · work</text>
  </g>

  <g id="preserve-step">
    <circle cx="930" cy="208" r="29" fill="#D99778"/>
    <text x="930" y="216" text-anchor="middle"
          fill="#101312"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" font-weight="700">04</text>
    <text x="860" y="270"
          fill="#D99778"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="1">PRESERVE</text>
    <text x="860" y="304"
          fill="#F3F0E8"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19">canonical record</text>
    <text x="860" y="334"
          fill="#AEB8AF"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">provenance · time</text>
  </g>

  <path d="M56 354H1144" stroke="#2A332E" stroke-width="1"/>
  <text x="56" y="365"
        fill="#77847B"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14">the repository grows from real usage, not from a pre-built topic taxonomy</text>
</svg>
