<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="model-title model-desc">
  <title id="model-title">The wooju-brain core model</title>
  <desc id="model-desc">Four columns describe the repository boundaries: evidence, world knowledge, personal memory, and action context, with an evidence-to-synthesis link from library and sources to wiki.</desc>

  <rect width="1200" height="500" rx="26" fill="#F4F1EA"/>
  <text x="56" y="62"
        fill="#69766D"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" letter-spacing="1.3">THE CORE MODEL / KEEP MEANINGS DISTINCT</text>
  <text x="56" y="112"
        fill="#171B19"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">One repository, four durable boundaries.</text>
  <text x="56" y="148"
        fill="#536057"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20">Each layer answers a different question; links carry context without collapsing it.</text>

  <g id="evidence-column">
    <rect x="56" y="200" width="246" height="226" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="56" y="200" width="246" height="6" rx="3" fill="#E5A15F"/>
    <text x="78" y="242"
          fill="#C07C36"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.1">01 / EVIDENCE</text>
    <text x="78" y="282"
          fill="#171B19"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="27" font-weight="700">library/</text>
    <text x="78" y="312"
          fill="#48564D"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21">sources/</text>
    <path d="M78 334H266" stroke="#D8D0C3" stroke-width="1"/>
    <text x="78" y="366"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What does this</text>
    <text x="78" y="392"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">source support?</text>
  </g>

  <g id="world-column">
    <rect x="326" y="200" width="246" height="226" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="326" y="200" width="246" height="6" rx="3" fill="#9BC4A4"/>
    <text x="348" y="242"
          fill="#4F8660"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.1">02 / WORLD KNOWLEDGE</text>
    <text x="348" y="282"
          fill="#171B19"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="27" font-weight="700">wiki/</text>
    <text x="348" y="312"
          fill="#48564D"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21">synthesis</text>
    <path d="M348 334H536" stroke="#D8D0C3" stroke-width="1"/>
    <text x="348" y="366"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What do we</text>
    <text x="348" y="392"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">understand now?</text>
  </g>

  <path d="M302 228H320" stroke="#C07C36" stroke-width="2"/>
  <path d="M315 223L321 228L315 233" fill="none" stroke="#C07C36" stroke-width="2"/>
  <text x="298" y="455"
        text-anchor="end"
        fill="#8C6A45"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15">source → synthesis</text>

  <g id="personal-column">
    <rect x="596" y="200" width="246" height="226" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="596" y="200" width="246" height="6" rx="3" fill="#8CB5D1"/>
    <text x="618" y="242"
          fill="#527B98"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.1">03 / PERSONAL MEMORY</text>
    <text x="618" y="282"
          fill="#171B19"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="27" font-weight="700">memory/</text>
    <text x="618" y="312"
          fill="#48564D"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19">records · events</text>
    <text x="618" y="335"
          fill="#48564D"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19">state</text>
    <path d="M618 354H806" stroke="#D8D0C3" stroke-width="1"/>
    <text x="618" y="386"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What is known</text>
    <text x="618" y="412"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">about the user?</text>
  </g>

  <g id="action-column">
    <rect x="866" y="200" width="278" height="226" rx="18" fill="#FFFDF8" stroke="#CEC7BA" stroke-width="1.5"/>
    <rect x="866" y="200" width="278" height="6" rx="3" fill="#D99778"/>
    <text x="888" y="242"
          fill="#A7644A"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="1.1">04 / ACTION CONTEXT</text>
    <text x="888" y="282"
          fill="#171B19"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="27" font-weight="700">projects/</text>
    <text x="888" y="312"
          fill="#48564D"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21">+ areas/</text>
    <path d="M888 334H1110" stroke="#D8D0C3" stroke-width="1"/>
    <text x="888" y="366"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">What is being</text>
    <text x="888" y="392"
          fill="#536057"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="19">done or managed?</text>
  </g>

  <path d="M842 228H860" stroke="#8A928B" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="844" y="455"
        text-anchor="end"
        fill="#69766D"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15">context links, not one bucket</text>
</svg>
